steps:
  # Step 1: Compile the Java application to generate the JAR file
  - name: gcr.io/cloud-builders/mvn
    args:
      - clean
      - package
      - -DskipTests # Optional: Skips tests to speed up the pipeline

  # Step 2: Build the Docker image (now target/ compiled files will exist)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/project-7f2a8cf5-3c37-47b0-968/keycloak-images/keycloak-event-listener:1.0.0
      - .

images:
  - asia-south1-docker.pkg.dev/project-7f2a8cf5-3c37-47b0-968/keycloak-images/keycloak-event-listener:1.0.0

options:
  logging: CLOUD_LOGGING_ONLY
